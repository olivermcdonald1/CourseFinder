# The seat sweep needs no server: it is ~100 seconds once a day, so it runs
# here and writes straight to the database. Nothing to host, nothing to keep
# awake, and the collector's logs are the run history.
name: collect seats

on:
  schedule:
    # Seven sweeps a day, roughly every three hours, skewed toward waking hours
    # in Eastern time. Seats move during add/drop -- MATH 223 shed 110 of them
    # in fifteen days -- and a number that is 23 hours old is not a live seat
    # count, it is yesterday's.
    #
    # Seven is a deliberate ceiling, not a starting point. VSB is student-run
    # infrastructure and each sweep is 76 batched requests per term; polling it
    # hourly would be taking far more than this needs. If this ever wants to be
    # more frequent, the answer is fetching one course on demand, not sweeping
    # all 7,446 more often.
    #
    # GitHub's scheduler runs late under load, so nothing downstream may assume
    # an exact time -- the loader is idempotent and keyed on the observation
    # date, not on when the job fired.
    - cron: "0 5,8,11,14,17,20,23 * * *"
  workflow_dispatch:        # so a sweep can be forced by hand after a failure

concurrency:
  # Two sweeps at once would race on the same (crn, term) rows. The later one
  # waits rather than being dropped, so a manual run during a slow scheduled
  # run still happens.
  group: collect
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      # One real page load per sweep, to read the t/e time checksum off a
      # genuine class-data request. Without those VSB answers "Please correct
      # your device's timezone and time" -- so the browser is not optional.
      - run: uv run playwright install --with-deps chromium

      - name: Sweep both terms
        run: |
          uv run python collector/vsb_collect.py --term 202609
          uv run python collector/vsb_collect.py --term 202701

      - name: Load observations
        run: uv run python load_observations.py

      - name: Prune snapshots past the retention window
        run: uv run python scripts/prune_snapshots.py --days 90

      # The XML is regenerable and large; keep it only long enough to debug a
      # failed run.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-xml
          path: data/raw/
          retention-days: 3
