services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coursefinder
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: coursefinder
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data      # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursefinder"]
      interval: 5s
      retries: 5

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: coursefinder
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: coursefinder_test
    ports:
      - "5433:5432"                          # different HOST port, same container port
    tmpfs:
      - /var/lib/postgresql/data             # in-memory: fast, wiped every restart

volumes:
  pgdata: